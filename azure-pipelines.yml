trigger:
  branches:
    include:
      - main  # Change if using another branch

pool:
  name: Default  # Self-hosted agent pool ka naam (default ya custom)

variables:
  TF_VERSION: '1.5.0'

stages:
- stage: Terraform
  displayName: "Terraform Deploy"
  jobs:
  - job: Run_Terraform
    displayName: "Run Terraform from local agent"
    steps:

    # Step 1: Checkout GitHub Code
    - checkout: self

    # Step 2: (Optional) Install Terraform if not installed locally
    # # Comment out if Terraform already exists on agent
    # - task: TerraformInstaller@1
    #   inputs:
    #     terraformVersion: '$(TF_VERSION)'

    # Step 3: Terraform Init
    - script: |
        terraform init \
          -backend-config="resource_group_name=<BACKEND_RESOURCE_GROUP>" \
          -backend-config="storage_account_name=<BACKEND_STORAGE_ACCOUNT>" \
          -backend-config="container_name=<BACKEND_CONTAINER>" \
          -backend-config="key=terraform.tfstate"
      displayName: 'Terraform Init'

    # Step 4: Terraform Plan
    - script: |
        terraform plan \
          -out=tfplan \
          -input=false
      displayName: 'Terraform Plan'

    # Step 5: Terraform Apply
    - script: |
        terraform apply -input=false -auto-approve tfplan
      displayName: 'Terraform Apply'